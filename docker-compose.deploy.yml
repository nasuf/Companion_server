services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-companion}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-companion}"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=8MB"
    volumes:
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/postgres:/var/lib/postgresql/data"
    ports:
      - "0.0.0.0:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-companion} -d ${POSTGRES_DB:-companion}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: companion-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: companion-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-10m}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
    volumes:
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/ollama:/root/.ollama"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  server:
    image: companion-server:deploy
    build:
      context: .
      args:
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-https://mirrors.tencentyun.com/debian}"
        DEBIAN_SECURITY_MIRROR: "${DEBIAN_SECURITY_MIRROR:-https://mirrors.tencentyun.com/debian-security}"
        # 内网镜像偶发坏文件 (2026-07-18 libfontconfig1/libasyncns0 持续 SSL EOF);
        # 降级镜像必须选国内其他厂商 — deb.debian.org 跨境太慢会撞 ssh 超时.
        DEBIAN_FALLBACK_MIRROR: "${DEBIAN_FALLBACK_MIRROR:-https://mirrors.aliyun.com/debian}"
        DEBIAN_SECURITY_FALLBACK_MIRROR: "${DEBIAN_SECURITY_FALLBACK_MIRROR:-https://mirrors.aliyun.com/debian-security}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}"
    container_name: companion-server
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # uvicorn worker 数。必须与 settings.web_concurrency 同值 —— 后者是若干
      # 进程内上限 (LLM 并发槽位) 的分母, 对不上会让全局上限漂掉。
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      DB_CONNECTION_LIMIT: "${DB_CONNECTION_LIMIT:-12}"
      DB_CONNECTION_LIMIT_MAX: "${DB_CONNECTION_LIMIT_MAX:-15}"
      DB_MAX_CONCURRENT_QUERIES: "${DB_MAX_CONCURRENT_QUERIES:-10}"
      DB_QUERY_MAX_RETRIES: "${DB_QUERY_MAX_RETRIES:-4}"
      OFFLINE_MEDIA_DIR: "${OFFLINE_MEDIA_DIR:-/data/offline_media}"
      OFFLINE_MEDIA_PUBLIC_PREFIX: "${OFFLINE_MEDIA_PUBLIC_PREFIX:-/offline/media}"
      USER_AVATAR_DIR: "${USER_AVATAR_DIR:-/data/user_avatar}"
      # 前缀不带 /api —— Flutter / 小程序 / web 三端的 BASE_URL 已经是
      # https://banshengcomp.com/api, 都会自己把相对路径拼上去。
      USER_AVATAR_PUBLIC_PREFIX: "${USER_AVATAR_PUBLIC_PREFIX:-/users/avatar}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/chat_media:/data/chat_media"
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/offline_media:/data/offline_media"
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/capsule_media:/data/capsule_media"
      - "${COMPANION_DATA_DIR:-/mnt/datadisk0/companion}/user_avatar:/data/user_avatar"
      - "/app/companion-secrets:/app/companion-secrets:ro"
      # 后台管理要能看/删/触发数据库备份, 所以给 server 读写宿主机备份目录。
      # 定时备份仍由宿主机 cron 跑 —— 备份最需要生效的时刻正是应用出问题的时候,
      # 挂进应用进程等于让它跟着一起死。这里只服务界面上的手动操作。
      - "/var/backups/companion:/var/backups/companion"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
