[project]
name = "companion-server"
version = "0.1.0"
description = "AI Memory-driven Chat Agent Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "prisma>=0.15.0",
    "nodejs-bin==18.4.0a4",
    "redis[hiredis]>=5.2.0",
    # Match the qualified production model stack; graph adoption is not a provider upgrade.
    "langchain-core==1.6.6",
    "langsmith==0.14.4",
    "langgraph==1.1.0",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.0.10",
    "langgraph-sdk==0.3.15",
    "langchain-ollama==1.1.0",
    "langchain-anthropic==1.7.5",
    "langchain-openai==1.6.7",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "httpx[http2]>=0.28.0",
    # Public link fetch transport uses the qualified HTTPcore network-backend API.
    "httpcore==1.0.9",
    # Keep the same CA bundle used by the qualified HTTPX stack.
    "certifi==2026.7.22",
    "alibabacloud_iqs20240712==6.0.1",
    "sse-starlette>=2.2.0",
    "apscheduler>=3.11.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    # Part 5 §2.1: 农历转换支持 (春节等动态计算)
    "lunardate>=0.2.2",
    # Part 5 §2.1: NTP 时间校准
    "ntplib>=0.4.0",
    # spec-audit 2026-04-23: 国务院法定假日 + 调休数据 (admin-curated holidays 表的外部源)
    "chinesecalendar>=1.11.0",
    # 结构化日志 → Axiom (https://app.axiom.co), env 未配置时 setup_axiom() 自动跳过
    "axiom-py>=0.9.0",
    "cryptography>=42.0.0",
    # 聊天图片缩略图生成 + 上传原图归一化 (EXIF 转正 / 超大图重编码)
    "pillow>=11.0.0",
    # Search indexes can label the same Chinese place in simplified/traditional.
    "opencc-python-reimplemented==0.1.7",
    "app-store-server-library>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov==7.1.0",
    "playwright==1.63.0",
    "coverage==7.16.2",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
