name: CI / Deploy Companion Server

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copy project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          source: "app,jobs,prisma,scripts,pyproject.toml,Dockerfile,docker-compose.deploy.yml,.dockerignore,.env.example"
          target: "/app/companion-server"

      - name: Deploy server stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          # 默认 10m 不够: docker build 拉 Prisma CLI 二进制偶发缓慢,
          # 成功案例也要 8m+, 超时会把部署杀在半路 (2026-07-08 生产复现).
          # 45m: apt 镜像降级重装 217MB 系统依赖需要额外余量 (2026-07-18 复现
          # 30m 把降级安装杀在半路).
          command_timeout: 45m
          script: |
            set -euo pipefail

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            DOCKER="docker"
            if ! docker ps >/dev/null 2>&1; then
              DOCKER="sudo docker"
            fi

            sudo mkdir -p /app/companion-server /app/companion-secrets/apns /mnt/datadisk0/companion/{postgres,redis,ollama,logs,docker,chat_media,offline_media,capsule_media}
            sudo chown -R "$USER:$USER" /app/companion-server /mnt/datadisk0/companion/{logs,chat_media,offline_media,capsule_media}
            cd /app/companion-server

            POSTGRES_USER="${{ vars.POSTGRES_USER || 'companion' }}"
            POSTGRES_DB="${{ vars.POSTGRES_DB || 'companion' }}"
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            APNS_ENABLED="${{ vars.APNS_ENABLED || 'false' }}"
            mkdir -p /app/companion-server/secrets
            chmod 700 /app/companion-server/secrets

            cat > .env <<EOF
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=$POSTGRES_DB
            COMPANION_DATA_DIR=/mnt/datadisk0/companion
            CHAT_MEDIA_DIR=/data/chat_media
            CHAT_MEDIA_PUBLIC_PREFIX=/chat/media
            CAPSULE_MEDIA_DIR=/data/capsule_media
            CAPSULE_MEDIA_PUBLIC_PREFIX=/api/capsules/media
            DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?connection_limit=3&pool_timeout=30&connect_timeout=30
            DIRECT_DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?connection_limit=1&pool_timeout=60&connect_timeout=30
            MIGRATION_DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?connection_limit=1&pool_timeout=60&connect_timeout=30
            APP_ENV=production
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            REDIS_URL=redis://redis:6379/0
            OLLAMA_BASE_URL=${{ vars.OLLAMA_BASE_URL }}
            DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
            DASHSCOPE_BASE_URL=${{ vars.DASHSCOPE_BASE_URL }}
            DASHSCOPE_CHARACTER_BASE_URL=${{ vars.DASHSCOPE_CHARACTER_BASE_URL }}
            DASHSCOPE_ENABLE_THINKING=${{ vars.DASHSCOPE_ENABLE_THINKING }}
            DASHSCOPE_ASR_ENDPOINT=${{ vars.DASHSCOPE_ASR_ENDPOINT || 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation' }}
            DASHSCOPE_ASR_MODEL=${{ vars.DASHSCOPE_ASR_MODEL || 'fun-asr-flash-2026-06-15' }}
            DASHSCOPE_ASR_TIMEOUT_S=${{ vars.DASHSCOPE_ASR_TIMEOUT_S || '30' }}
            CHAT_VOICE_MIN_SECONDS=${{ vars.CHAT_VOICE_MIN_SECONDS || '0.5' }}
            CHAT_VOICE_MAX_SECONDS=${{ vars.CHAT_VOICE_MAX_SECONDS || '60' }}
            CHAT_VOICE_MAX_REQUESTS_PER_MINUTE=${{ vars.CHAT_VOICE_MAX_REQUESTS_PER_MINUTE || '20' }}
            CHAT_VOICE_MAX_BYTES=${{ vars.CHAT_VOICE_MAX_BYTES || '2097152' }}
            ONLINE_MODEL=${{ vars.ONLINE_MODEL }}
            REMOTE_PROVIDER=${{ vars.REMOTE_PROVIDER }}
            REMOTE_CHAT_PROVIDER=${{ vars.REMOTE_CHAT_PROVIDER }}
            REMOTE_SMALL_PROVIDER=${{ vars.REMOTE_SMALL_PROVIDER }}
            LOCAL_CHAT_MODEL=${{ vars.LOCAL_CHAT_MODEL }}
            LOCAL_SMALL_MODEL=${{ vars.LOCAL_SMALL_MODEL }}
            REMOTE_CHAT_MODEL=${{ vars.REMOTE_CHAT_MODEL }}
            REMOTE_SMALL_MODEL=${{ vars.REMOTE_SMALL_MODEL }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
            ARK_API_KEY=${{ secrets.ARK_API_KEY }}
            ARK_BASE_URL=${{ vars.ARK_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
            DOUBAO_VISION_MODEL=${{ vars.DOUBAO_VISION_MODEL || 'doubao-1-5-vision-pro-32k-250115' }}
            MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
            MINIMAX_BASE_URL=${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/v1' }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            TRACE_BACKEND=${{ vars.TRACE_BACKEND || 'local' }}
            TRACE_RETENTION_DAYS=${{ vars.TRACE_RETENTION_DAYS || '30' }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            REPLY_DELAY_ENABLED=${{ vars.REPLY_DELAY_ENABLED }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_ORG_ID=${{ vars.LANGSMITH_ORG_ID }}
            LANGSMITH_PROJECT_ID=${{ vars.LANGSMITH_PROJECT_ID }}
            AXIOM_TOKEN=${{ secrets.AXIOM_TOKEN }}
            AXIOM_DATASET=${{ vars.AXIOM_DATASET }}
            AXIOM_ORG_ID=${{ vars.AXIOM_ORG_ID }}
            AXIOM_LOG_LEVEL=${{ vars.AXIOM_LOG_LEVEL }}
            EMBEDDING_MODEL=${{ vars.EMBEDDING_MODEL }}
            EMBEDDING_PROVIDER=${{ vars.EMBEDDING_PROVIDER }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PROACTIVE_PROCESSING_TIMEOUT_S=${{ vars.PROACTIVE_PROCESSING_TIMEOUT_S || '300' }}
            EMOTION_KEYWORD_FAST_PATH=${{ vars.EMOTION_KEYWORD_FAST_PATH || 'true' }}
            BACKGROUND_TASK_MAX_CONCURRENCY=${{ vars.BACKGROUND_TASK_MAX_CONCURRENCY || '256' }}
            WECHAT_LOGIN_ENABLED=${{ vars.WECHAT_LOGIN_ENABLED || 'false' }}
            WECHAT_MOBILE_APP_ID=${{ vars.WECHAT_MOBILE_APP_ID }}
            WECHAT_MOBILE_APP_SECRET=${{ secrets.WECHAT_MOBILE_APP_SECRET }}
            WECHAT_MINI_APP_ID=${{ vars.WECHAT_MINI_APP_ID }}
            WECHAT_MINI_APP_SECRET=${{ secrets.WECHAT_MINI_APP_SECRET }}
            WECHAT_H5_APP_ID=${{ vars.WECHAT_H5_APP_ID }}
            WECHAT_H5_APP_SECRET=${{ secrets.WECHAT_H5_APP_SECRET }}
            WECHAT_JSSDK_ALLOWED_ORIGINS=${{ vars.WECHAT_JSSDK_ALLOWED_ORIGINS || 'https://banshengcomp.com' }}
            SMS_ENABLED=${{ vars.SMS_ENABLED || 'false' }}
            TENCENT_SMS_SECRET_ID=${{ secrets.TENCENT_SMS_SECRET_ID }}
            TENCENT_SMS_SECRET_KEY=${{ secrets.TENCENT_SMS_SECRET_KEY }}
            TENCENT_SMS_SDK_APP_ID=${{ vars.TENCENT_SMS_SDK_APP_ID }}
            TENCENT_SMS_SIGN_NAME=${{ vars.TENCENT_SMS_SIGN_NAME }}
            TENCENT_SMS_TEMPLATE_ID=${{ vars.TENCENT_SMS_TEMPLATE_ID }}
            TENCENT_SMS_REGION=${{ vars.TENCENT_SMS_REGION || 'ap-guangzhou' }}
            MEAL_STAFF_KEY=${{ secrets.MEAL_STAFF_KEY }}
            MEAL_STAFF_JWT_EXPIRY_HOURS=${{ vars.MEAL_STAFF_JWT_EXPIRY_HOURS || '12' }}
            MEAL_QR_TTL_SECONDS=${{ vars.MEAL_QR_TTL_SECONDS || '60' }}
            MEAL_MERCHANT_JWT_EXPIRY_HOURS=${{ vars.MEAL_MERCHANT_JWT_EXPIRY_HOURS || '12' }}
            JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
            JAMENDO_BASE_URL=${{ vars.JAMENDO_BASE_URL || 'https://api.jamendo.com/v3.0' }}
            JAMENDO_DEFAULT_LIBRARIES=${{ vars.JAMENDO_DEFAULT_LIBRARIES || 'focus,ambient,sleep' }}
            PROACTIVE_LINK_RECOMMENDATION_ENABLED=${{ vars.PROACTIVE_LINK_RECOMMENDATION_ENABLED || 'true' }}
            PROACTIVE_LINK_RECOMMENDATION_PROBABILITY=${{ vars.PROACTIVE_LINK_RECOMMENDATION_PROBABILITY || '0.03' }}
            CHAT_LINK_SEARCH_PROVIDER=${{ vars.CHAT_LINK_SEARCH_PROVIDER || 'custom' }}
            TAVILY_SEARCH_ENDPOINT=${{ vars.TAVILY_SEARCH_ENDPOINT || 'https://api.tavily.com/search' }}
            CHAT_LINK_SEARCH_TIMEOUT_S=${{ vars.CHAT_LINK_SEARCH_TIMEOUT_S || '8' }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            APNS_ENABLED=$APNS_ENABLED
            APNS_TEAM_ID=${{ vars.APNS_TEAM_ID }}
            APNS_KEY_ID=${{ secrets.APNS_KEY_ID }}
            APNS_AUTH_KEY_PATH=${{ secrets.APNS_AUTH_KEY }}
            APNS_AUTH_KEY=
            APNS_TOPIC=${{ vars.APNS_TOPIC || 'com.bansheng.dev' }}
            APNS_USE_SANDBOX=${{ vars.APNS_USE_SANDBOX || 'false' }}
            NOTIFICATION_MAX_ATTEMPTS=${{ vars.NOTIFICATION_MAX_ATTEMPTS || '3' }}
            NOTIFICATION_DISPATCH_BATCH_SIZE=${{ vars.NOTIFICATION_DISPATCH_BATCH_SIZE || '50' }}
            EOF

            for key in POSTGRES_PASSWORD DATABASE_URL MIGRATION_DATABASE_URL REDIS_URL JWT_SECRET CORS_ALLOWED_ORIGINS OLLAMA_BASE_URL EMBEDDING_MODEL EMBEDDING_PROVIDER DASHSCOPE_API_KEY DASHSCOPE_ASR_ENDPOINT DASHSCOPE_ASR_MODEL JAMENDO_CLIENT_ID JAMENDO_BASE_URL JAMENDO_DEFAULT_LIBRARIES ARK_API_KEY ARK_BASE_URL DOUBAO_VISION_MODEL; do
              value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
              if [ -z "$value" ]; then
                echo "$key is required for production deploy"
                exit 1
              fi
            done

            if [ -n "$(grep -E '^WECHAT_JSSDK_ALLOWED_ORIGINS=' .env | cut -d= -f2-)" ]; then
              for key in WECHAT_H5_APP_ID WECHAT_H5_APP_SECRET; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when WECHAT_JSSDK_ALLOWED_ORIGINS is configured"
                  exit 1
                fi
              done
            fi

            CHAT_LINK_SEARCH_PROVIDER_VALUE="$(grep -E '^CHAT_LINK_SEARCH_PROVIDER=' .env | cut -d= -f2-)"
            if [ "$CHAT_LINK_SEARCH_PROVIDER_VALUE" = "tavily" ]; then
              for key in TAVILY_API_KEY TAVILY_SEARCH_ENDPOINT CHAT_LINK_SEARCH_TIMEOUT_S; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when CHAT_LINK_SEARCH_PROVIDER=tavily"
                  exit 1
                fi
              done
            fi

            if [ "$APNS_ENABLED" = "true" ]; then
              for key in APNS_TEAM_ID APNS_KEY_ID APNS_AUTH_KEY_PATH APNS_TOPIC APNS_USE_SANDBOX; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when APNS_ENABLED=true"
                  exit 1
                fi
              done
              APNS_AUTH_KEY_PATH_VALUE="$(grep -E '^APNS_AUTH_KEY_PATH=' .env | cut -d= -f2-)"
              if [ "$APNS_AUTH_KEY_PATH_VALUE" != "/app/companion-secrets/apns/AuthKey_SG87KSNWZH.p8" ]; then
                echo "APNS_AUTH_KEY must be /app/companion-secrets/apns/AuthKey_SG87KSNWZH.p8"
                exit 1
              fi
              if ! sudo test -r "$APNS_AUTH_KEY_PATH_VALUE"; then
                echo "APNS_AUTH_KEY must be a readable .p8 file path on the VPS when APNS_ENABLED=true"
                exit 1
              fi
              if ! sudo grep -q "BEGIN PRIVATE KEY" "$APNS_AUTH_KEY_PATH_VALUE"; then
                echo "APNS_AUTH_KEY path does not point to a valid .p8 private key file"
                exit 1
              fi
            fi

            echo "==> Building server image"
            $DOCKER compose -f docker-compose.deploy.yml build server

            echo "==> Starting data services"
            $DOCKER compose -f docker-compose.deploy.yml up -d postgres redis ollama

            EMBEDDING_MODEL_VALUE="$(grep -E '^EMBEDDING_MODEL=' .env | cut -d= -f2-)"
            if ! $DOCKER compose -f docker-compose.deploy.yml exec -T ollama ollama list | awk 'NR > 1 {print $1}' | grep -Eq "^${EMBEDDING_MODEL_VALUE}(:|$)"; then
              echo "==> Pulling embedding model: ${EMBEDDING_MODEL_VALUE}"
              $DOCKER compose -f docker-compose.deploy.yml exec -T ollama ollama pull "$EMBEDDING_MODEL_VALUE"
            fi

            echo "==> Stopping server before migrations"
            $DOCKER compose -f docker-compose.deploy.yml stop server || true

            echo "==> Running database migrations"
            MIGRATION_DATABASE_URL_VALUE="$(grep -E '^MIGRATION_DATABASE_URL=' .env | cut -d= -f2-)"
            if [ -z "$MIGRATION_DATABASE_URL_VALUE" ]; then
              echo "MIGRATION_DATABASE_URL secret is required for Prisma migrations"
              exit 1
            fi
            $DOCKER compose -f docker-compose.deploy.yml run --rm --no-deps \
              -e DATABASE_URL="$MIGRATION_DATABASE_URL_VALUE" \
              -e DIRECT_DATABASE_URL="$MIGRATION_DATABASE_URL_VALUE" \
              server prisma migrate deploy

            echo "==> Starting server stack"
            $DOCKER compose -f docker-compose.deploy.yml up -d --no-deps server
            $DOCKER compose -f docker-compose.deploy.yml ps

            echo "==> Waiting for server health"
            for i in $(seq 1 40); do
              status="$($DOCKER inspect -f '{{.State.Health.Status}}' companion-server 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                curl -fsS http://127.0.0.1:8000/health
                echo
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "companion-server did not become healthy"
                $DOCKER compose -f docker-compose.deploy.yml logs --tail=200 server || true
                exit 1
              fi
              sleep 3
            done

            echo "==> Cleaning up old docker images (>72h old, dangling, untagged)"
            # 防止历史 deploy 镜像层堆积撑爆磁盘 (Redis bgsave 一旦失败就锁所有
            # 写命令, 整个后端起不来). until=72h 安全保留近 3 天回滚目标; -a
            # 包含未被任何容器引用的具名 image, -f 跳过交互确认.
            # builder 缓存用 keep-storage 硬上限而非时间过滤: 密集部署期 (一天
            # 多次 push) 72h 窗口内的缓存也能堆到 15GB+ (2026-07-07 实测把系统
            # 盘吃到 74%), 按总量兜底才是有效边界; 2GB 足够保住最近一次构建的
            # 层缓存让增量构建仍然快.
            $DOCKER image prune -af --filter "until=72h" || true
            $DOCKER builder prune -af --keep-storage=2GB || true

            echo "==> Installing weekly disk cleanup cron (idempotent)"
            # 部署只在 push 时发生, 间隔可能数周; journal/apt/构建残渣的增长与
            # 部署无关, 所以再挂一个每周日 04:30 的 host cron 兜底. 策略全部
            # 有界: 不碰 volumes/数据盘, 镜像保留 72h 回滚窗口.
            sudo tee /usr/local/bin/companion-disk-cleanup.sh >/dev/null <<'CLEANUP'
            #!/bin/sh
            # Companion stack weekly disk cleanup (installed by deploy.yml; safe to re-run).
            # Bounded policies only — never touches volumes/data, keeps 72h rollback images.
            docker image prune -af --filter "until=72h" || true
            docker builder prune -af --keep-storage=2GB || true
            journalctl --vacuum-size=200M || true
            apt-get clean || true
            df -h / | tail -1 | logger -t companion-cleanup || true
            CLEANUP
            sudo chmod 755 /usr/local/bin/companion-disk-cleanup.sh
            sudo tee /etc/cron.d/companion-disk-cleanup >/dev/null <<'CRONTAB'
            30 4 * * 0 root /usr/local/bin/companion-disk-cleanup.sh >/dev/null 2>&1
            CRONTAB
            sudo chmod 644 /etc/cron.d/companion-disk-cleanup
