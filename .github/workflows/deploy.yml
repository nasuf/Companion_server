name: CI / Deploy Companion Server

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: companion-production
  cancel-in-progress: false

jobs:

  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # rsync 要以普通用户身份写入, 所以目标目录得先存在且属主正确。冷启动时
      # /app 本身不可写, 这一步不能省成 rsync --rsync-path='mkdir -p ...'。
      - name: Ensure target dir on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          script: |
            set -euo pipefail
            sudo mkdir -p /app/companion-server
            sudo chown -R "$USER:$USER" /app/companion-server
            sudo install -d -m 700 -o "$USER" -g "$USER" /app/companion-release-archives

      # 用 rsync 而不是 scp, 两个理由:
      #
      # 1) 增量。整包 17MB 里有 16MB 是 45 个头像 PNG, 而它们在 60 天 282 个 commit
      #    里只变过 2 次 —— 也就是 99% 的部署都在重传完全没变的东西。这条跨境链路
      #    实测在 28KB/s 到 520KB/s 之间剧烈抖动, 全量重传这一步花过 10-25 分钟。
      #    rsync 只传差异, 常规部署落到几十 KB, 抖动也就不再有放大器。
      #
      # 2) 删除语义。scp 只覆盖不删除, 从 git 删掉的文件会永远留在 VPS 上, 并被烘进
      #    之后每一个镜像。实测残留过 9 个文件, 含一个刚被重命名的模块 —— 新旧两个
      #    路径同时存在, 引用旧路径的地方拿到的是修复前的版本, 且不会报错。原先靠
      #    "先 rm -rf 再整包重传"绕过, 代价是两步之间 VPS 上没有源码 —— 2026-07-30
      #    取消两次部署就撞上了: 清空已执行、上传被中断, VPS 源码目录空到下一次部署
      #    才补回来。--delete 把删除变成传输本身的属性, 那个窗口随之消失。
      #
      # --delete 的删除范围只在传过去的那几个目录内部, 不会碰 /app/companion-server
      # 根下的 .env / secrets/ 等不在 source 列表里的东西 (已实测确认)。
      - name: Sync project to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 主机不可达时 ssh-keyscan 退出 1, set -e 会在这里就停 —— 比让 rsync
          # 抛一句 host key 相关的错好读。stderr 不吞: 失败原因要留在日志里。
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Run the candidate's standalone script before rsync replaces the old
          # compose/source and before the next step rewrites .env or stops server.
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -eu; ARCHIVE_DOCKER=docker; if command -v docker >/dev/null && ! docker ps >/dev/null 2>&1; then ARCHIVE_DOCKER='sudo docker'; fi; python3 - server --root /app/companion-release-archives/server --source /app/companion-server --docker \"\$ARCHIVE_DOCKER\" --incoming-commit '$RELEASE_SHA' --allow-first-deploy" \
            < scripts/release_archive.py

          # --checksum 是增量能不能成立的关键, 不是可选优化: git 不存 mtime, 每次
          # checkout 出来的文件时间戳都是全新的, rsync 默认的 size+mtime 快速判定
          # 会认为 611 个文件全都变了。按内容哈希比对才能真正跳过没动过的头像。
          # 两侧各多读一遍 17MB, 相对省下的跨境传输可以忽略。
          #
          # -v 逐条打印真正传输的文件和删除项。不加的话 rsync 在整段传输期间一字
          # 不出, 静默和挂死在 CI 日志上长得一模一样 (2026-07-30 冷启动那 11 分钟
          # 就是这么看着像卡死的)。
          #
          # -O 是让 -v 有用的前提, 不是可选项: git checkout 连目录 mtime 一起刷新,
          # 不加 -O 每次都要"更新"那 166 个目录, -v 就把日志刷满目录名, 真正变了的
          # 一两个文件反而被埋掉。目录时间戳对这套部署没有意义 (Docker COPY 不看)。
          # 实测 —— 无内容变化: 166 行 → 0 行; 改 1 个文件带 1 个删除: 168 行 → 2 行。
          #
          # --stats 收尾给出实际字节数与速率。增量哪天失效了 (例如有人往 source 里
          # 加了每次都变的生成物), 这里一眼能看出来, 而不是等又慢回十分钟才有人察觉。
          rsync -azvcO --delete --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o BatchMode=yes" \
            app jobs prisma scripts \
            pyproject.toml runtime-constraints.txt Dockerfile docker-compose.deploy.yml .dockerignore .env.example \
            "$VPS_USER@$VPS_HOST:/app/companion-server/"

          # Only deterministic runtime validators are required by Docker COPY.
          # --relative preserves evals/ without transferring optional datasets/results.
          rsync -azvcOR --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o BatchMode=yes" \
            evals/__init__.py evals/graders.py evals/run_local.py \
            evals/long_companion_sim.py evals/cases.jsonl \
            "$VPS_USER@$VPS_HOST:/app/companion-server/"

      - name: Deploy server stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          # 默认 10m 不够: docker build 拉 Prisma CLI 二进制偶发缓慢,
          # 成功案例也要 8m+, 超时会把部署杀在半路 (2026-07-08 生产复现).
          # 45m: apt 镜像降级重装 217MB 系统依赖需要额外余量 (2026-07-18 复现
          # 30m 把降级安装杀在半路).
          command_timeout: 45m
          script: |
            set -euo pipefail

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            DOCKER="docker"
            if ! docker ps >/dev/null 2>&1; then
              DOCKER="sudo docker"
            fi

            sudo mkdir -p /app/companion-server /app/companion-secrets/apns /app/companion-secrets/iap /mnt/datadisk0/companion/{postgres,redis,ollama,logs,docker,chat_media,offline_media,capsule_media}
            sudo chown -R "$USER:$USER" /app/companion-server /mnt/datadisk0/companion/{logs,chat_media,offline_media,capsule_media}
            cd /app/companion-server

            POSTGRES_USER="${{ vars.POSTGRES_USER || 'companion' }}"
            POSTGRES_DB="${{ vars.POSTGRES_DB || 'companion' }}"
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            APNS_ENABLED="${{ vars.APNS_ENABLED || 'false' }}"
            mkdir -p /app/companion-server/secrets
            chmod 700 /app/companion-server/secrets

            cat > .env <<EOF
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=$POSTGRES_DB
            COMPANION_DATA_DIR=/mnt/datadisk0/companion
            CHAT_MEDIA_DIR=/data/chat_media
            CHAT_MEDIA_PUBLIC_PREFIX=/chat/media
            CAPSULE_MEDIA_DIR=/data/capsule_media
            CAPSULE_MEDIA_PUBLIC_PREFIX=/api/capsules/media
            USER_AVATAR_DIR=/data/user_avatar
            USER_AVATAR_PUBLIC_PREFIX=/users/avatar
            DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?connection_limit=12&pool_timeout=30&connect_timeout=30
            DIRECT_DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?connection_limit=1&pool_timeout=60&connect_timeout=30
            MIGRATION_DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?connection_limit=1&pool_timeout=60&connect_timeout=30
            APP_ENV=production
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            REDIS_URL=redis://redis:6379/0
            OLLAMA_BASE_URL=${{ vars.OLLAMA_BASE_URL }}
            DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
            DASHSCOPE_BASE_URL=${{ vars.DASHSCOPE_BASE_URL }}
            DASHSCOPE_CHARACTER_BASE_URL=${{ vars.DASHSCOPE_CHARACTER_BASE_URL }}
            DASHSCOPE_ENABLE_THINKING=${{ vars.DASHSCOPE_ENABLE_THINKING }}
            DASHSCOPE_ASR_ENDPOINT=${{ vars.DASHSCOPE_ASR_ENDPOINT || 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation' }}
            DASHSCOPE_ASR_MODEL=${{ vars.DASHSCOPE_ASR_MODEL || 'fun-asr-flash-2026-06-15' }}
            DASHSCOPE_ASR_TIMEOUT_S=${{ vars.DASHSCOPE_ASR_TIMEOUT_S || '30' }}
            DASHSCOPE_TTS_API_KEY=${{ secrets.DASHSCOPE_TTS_API_KEY }}
            DASHSCOPE_TTS_ENDPOINT=${{ vars.DASHSCOPE_TTS_ENDPOINT || 'https://dashscope.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer' }}
            DASHSCOPE_TTS_MODEL=${{ vars.DASHSCOPE_TTS_MODEL || 'qwen-audio-3.0-tts-plus' }}
            DASHSCOPE_TTS_TIMEOUT_S=${{ vars.DASHSCOPE_TTS_TIMEOUT_S || '60' }}
            DASHSCOPE_TTS_MAX_BYTES=${{ vars.DASHSCOPE_TTS_MAX_BYTES || '8388608' }}
            DASHSCOPE_TTS_MAX_CONCURRENCY=${{ vars.DASHSCOPE_TTS_MAX_CONCURRENCY || '16' }}
            DASHSCOPE_TTS_VOICE_ENROLLMENT_ENDPOINT=${{ vars.DASHSCOPE_TTS_VOICE_ENROLLMENT_ENDPOINT || 'https://dashscope.aliyuncs.com/api/v1/services/audio/tts/customization' }}
            TTS_VOICE_ENROLLMENT_PUBLIC_BASE_URL=${{ vars.TTS_VOICE_ENROLLMENT_PUBLIC_BASE_URL || 'https://banshengcomp.com/api' }}
            TTS_VOICE_ENROLLMENT_MAX_BYTES=${{ vars.TTS_VOICE_ENROLLMENT_MAX_BYTES || '15728640' }}
            TTS_OUTPUT_PROBABILITY=${{ vars.TTS_OUTPUT_PROBABILITY || '0' }}
            TTS_PRICE_CNY_PER_10K_CHARS=${{ vars.TTS_PRICE_CNY_PER_10K_CHARS || '1.12413' }}
            CHAT_VOICE_MIN_SECONDS=${{ vars.CHAT_VOICE_MIN_SECONDS || '0.5' }}
            CHAT_VOICE_MAX_SECONDS=${{ vars.CHAT_VOICE_MAX_SECONDS || '60' }}
            CHAT_VOICE_MAX_REQUESTS_PER_MINUTE=${{ vars.CHAT_VOICE_MAX_REQUESTS_PER_MINUTE || '20' }}
            CHAT_VOICE_MAX_BYTES=${{ vars.CHAT_VOICE_MAX_BYTES || '2097152' }}
            ONLINE_MODEL=${{ vars.ONLINE_MODEL }}
            REMOTE_PROVIDER=${{ vars.REMOTE_PROVIDER }}
            REMOTE_CHAT_PROVIDER=${{ vars.REMOTE_CHAT_PROVIDER }}
            REMOTE_SMALL_PROVIDER=${{ vars.REMOTE_SMALL_PROVIDER }}
            LOCAL_CHAT_MODEL=${{ vars.LOCAL_CHAT_MODEL }}
            LOCAL_SMALL_MODEL=${{ vars.LOCAL_SMALL_MODEL }}
            REMOTE_CHAT_MODEL=${{ vars.REMOTE_CHAT_MODEL }}
            REMOTE_SMALL_MODEL=${{ vars.REMOTE_SMALL_MODEL }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
            ARK_API_KEY=${{ secrets.ARK_API_KEY }}
            ARK_BASE_URL=${{ vars.ARK_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
            DOUBAO_VISION_MODEL=${{ vars.DOUBAO_VISION_MODEL || 'doubao-seed-2-0-mini-260428' }}
            MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
            MINIMAX_BASE_URL=${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/v1' }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            TRACE_BACKEND=${{ vars.TRACE_BACKEND || 'local' }}
            TRACE_RETENTION_DAYS=${{ vars.TRACE_RETENTION_DAYS || '30' }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            REPLY_DELAY_ENABLED=${{ vars.REPLY_DELAY_ENABLED }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_ORG_ID=${{ vars.LANGSMITH_ORG_ID }}
            LANGSMITH_PROJECT_ID=${{ vars.LANGSMITH_PROJECT_ID }}
            AXIOM_TOKEN=${{ secrets.AXIOM_TOKEN }}
            AXIOM_DATASET=${{ vars.AXIOM_DATASET }}
            AXIOM_ORG_ID=${{ vars.AXIOM_ORG_ID }}
            AXIOM_LOG_LEVEL=${{ vars.AXIOM_LOG_LEVEL }}
            EMBEDDING_PROVIDER=${{ vars.EMBEDDING_PROVIDER }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            WS_ALLOWED_ORIGINS=${{ vars.WS_ALLOWED_ORIGINS || 'https://servicewechat.com' }}
            PROACTIVE_PROCESSING_TIMEOUT_S=${{ vars.PROACTIVE_PROCESSING_TIMEOUT_S || '300' }}
            EMOTION_KEYWORD_FAST_PATH=${{ vars.EMOTION_KEYWORD_FAST_PATH || 'true' }}
            BACKGROUND_TASK_MAX_CONCURRENCY=${{ vars.BACKGROUND_TASK_MAX_CONCURRENCY || '256' }}
            LLM_MAX_CONCURRENCY=${{ vars.LLM_MAX_CONCURRENCY || '64' }}
            LLM_BACKGROUND_MAX_CONCURRENCY=${{ vars.LLM_BACKGROUND_MAX_CONCURRENCY || '16' }}
            WECHAT_LOGIN_ENABLED=${{ vars.WECHAT_LOGIN_ENABLED || 'false' }}
            WECHAT_MOBILE_APP_ID=${{ vars.WECHAT_MOBILE_APP_ID }}
            WECHAT_MOBILE_APP_SECRET=${{ secrets.WECHAT_MOBILE_APP_SECRET }}
            WECHAT_MINI_APP_ID=${{ vars.WECHAT_MINI_APP_ID }}
            WECHAT_MINI_APP_SECRET=${{ secrets.WECHAT_MINI_APP_SECRET }}
            WECHAT_H5_APP_ID=${{ vars.WECHAT_H5_APP_ID }}
            WECHAT_H5_APP_SECRET=${{ secrets.WECHAT_H5_APP_SECRET }}
            WECHAT_JSSDK_ALLOWED_ORIGINS=${{ vars.WECHAT_JSSDK_ALLOWED_ORIGINS || 'https://banshengcomp.com' }}
            SMS_ENABLED=${{ vars.SMS_ENABLED || 'false' }}
            TENCENT_SMS_SECRET_ID=${{ secrets.TENCENT_SMS_SECRET_ID }}
            TENCENT_SMS_SECRET_KEY=${{ secrets.TENCENT_SMS_SECRET_KEY }}
            TENCENT_SMS_SDK_APP_ID=${{ vars.TENCENT_SMS_SDK_APP_ID }}
            TENCENT_SMS_SIGN_NAME=${{ vars.TENCENT_SMS_SIGN_NAME }}
            TENCENT_SMS_TEMPLATE_ID=${{ vars.TENCENT_SMS_TEMPLATE_ID }}
            TENCENT_SMS_REGION=${{ vars.TENCENT_SMS_REGION || 'ap-guangzhou' }}
            MEAL_STAFF_KEY=${{ secrets.MEAL_STAFF_KEY }}
            MEAL_STAFF_JWT_EXPIRY_HOURS=${{ vars.MEAL_STAFF_JWT_EXPIRY_HOURS || '12' }}
            MEAL_QR_TTL_SECONDS=${{ vars.MEAL_QR_TTL_SECONDS || '60' }}
            MEAL_MERCHANT_JWT_EXPIRY_HOURS=${{ vars.MEAL_MERCHANT_JWT_EXPIRY_HOURS || '12' }}
            JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
            JAMENDO_BASE_URL=${{ vars.JAMENDO_BASE_URL || 'https://api.jamendo.com/v3.0' }}
            JAMENDO_DEFAULT_LIBRARIES=${{ vars.JAMENDO_DEFAULT_LIBRARIES || 'focus,ambient,sleep' }}
            # 记忆整合 (周日 05:10 的 L3 簇压缩)。它是唯一会归档原始数据的维护
            # 任务, 所以两个开关都要能不改代码就调整:
            #   ENABLED     出事时的总闸
            #   WORKSPACES  逗号分隔的白名单, 非空时只对这些 workspace 生效。
            #               比直接关掉更有用 —— 先缩到一个 workspace 观察。
            # 默认值必须与 app/config.py 里的代码默认一致, 有守卫测试盯着。
            MEMORY_CONSOLIDATION_ENABLED=${{ vars.MEMORY_CONSOLIDATION_ENABLED || 'true' }}
            MEMORY_CONSOLIDATION_WORKSPACES=${{ vars.MEMORY_CONSOLIDATION_WORKSPACES }}
            PROACTIVE_LINK_RECOMMENDATION_ENABLED=${{ vars.PROACTIVE_LINK_RECOMMENDATION_ENABLED || 'true' }}
            PROACTIVE_LINK_RECOMMENDATION_PROBABILITY=${{ vars.PROACTIVE_LINK_RECOMMENDATION_PROBABILITY || '0.03' }}
            CHAT_LINK_SEARCH_PROVIDER=${{ vars.CHAT_LINK_SEARCH_PROVIDER || 'custom' }}
            TAVILY_SEARCH_ENDPOINT=${{ vars.TAVILY_SEARCH_ENDPOINT || 'https://api.tavily.com/search' }}
            CHAT_LINK_SEARCH_TIMEOUT_S=${{ vars.CHAT_LINK_SEARCH_TIMEOUT_S || '8' }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            # 主动交流 · 结构化热榜源 (2026-09-14 task#13). 默认走 DailyHot 免费公共实例
            # (MIT 开源, github.com/imsyy/DailyHot). 想自建换成自己 endpoint 即可.
            # 设为空串 → 关闭 hot_api, fallback tavily 通用搜.
            # max_age_days: URL 里带早年份 / published_at 超此天数 → 丢, 修 tavily
            # 返 2021 老 SEO 列表. 0 = 关闭 freshness filter.
            PROACTIVE_HOT_API_URL=${{ vars.PROACTIVE_HOT_API_URL || 'https://api-hot.imsyy.top' }}
            PROACTIVE_HOT_API_KEY=${{ secrets.PROACTIVE_HOT_API_KEY }}
            PROACTIVE_HOT_MAX_AGE_DAYS=${{ vars.PROACTIVE_HOT_MAX_AGE_DAYS || '2' }}
            APNS_ENABLED=$APNS_ENABLED
            APNS_TEAM_ID=${{ vars.APNS_TEAM_ID }}
            APNS_KEY_ID=${{ secrets.APNS_KEY_ID }}
            APNS_AUTH_KEY_PATH=${{ secrets.APNS_AUTH_KEY }}
            APNS_AUTH_KEY=
            APNS_TOPIC=${{ vars.APNS_TOPIC || 'com.bansheng.dev' }}
            APNS_USE_SANDBOX=${{ vars.APNS_USE_SANDBOX || 'false' }}
            # ── Apple 内购 (App Store Server API + Notifications V2)。.p8 走 APNS
            #    同款「私钥文件放 VPS, 配置里只存路径」约定: 手动把 In-App Purchase
            #    密钥 scp 到 /app/companion-secrets/iap/ (已 ro 挂载进容器), GH 里配路径。
            #    ENABLED 默认 false —— GH 变量/密钥齐了并翻成 true 才生效。
            APPLE_IAP_ENABLED=${{ vars.APPLE_IAP_ENABLED || 'false' }}
            APPLE_IAP_BUNDLE_ID=${{ vars.APPLE_IAP_BUNDLE_ID || 'com.bansheng.prod' }}
            APPLE_IAP_ISSUER_ID=${{ secrets.APPLE_IAP_ISSUER_ID }}
            APPLE_IAP_KEY_ID=${{ secrets.APPLE_IAP_KEY_ID }}
            APPLE_IAP_PRIVATE_KEY_PATH=${{ vars.APPLE_IAP_PRIVATE_KEY_PATH || '/app/companion-secrets/iap/SubscriptionKey.p8' }}
            APPLE_IAP_PRIVATE_KEY=
            APPLE_IAP_APP_APPLE_ID=${{ vars.APPLE_IAP_APP_APPLE_ID || '6779167374' }}
            APPLE_IAP_ENVIRONMENT=${{ vars.APPLE_IAP_ENVIRONMENT || 'auto' }}
            NOTIFICATION_MAX_ATTEMPTS=${{ vars.NOTIFICATION_MAX_ATTEMPTS || '3' }}
            NOTIFICATION_DISPATCH_BATCH_SIZE=${{ vars.NOTIFICATION_DISPATCH_BATCH_SIZE || '50' }}
            EOF

            # Private cohort survives rsync and .env regeneration. Fail before
            # stopping the running server if the operator configuration is invalid.
            python3 scripts/chat_graph_deploy_config.py \
              --env-file .env \
              --config-file /app/companion-secrets/chat-graph-rollout.json

            for key in POSTGRES_PASSWORD DATABASE_URL MIGRATION_DATABASE_URL REDIS_URL JWT_SECRET CORS_ALLOWED_ORIGINS OLLAMA_BASE_URL EMBEDDING_PROVIDER DASHSCOPE_API_KEY DASHSCOPE_ASR_ENDPOINT DASHSCOPE_ASR_MODEL DASHSCOPE_TTS_API_KEY DASHSCOPE_TTS_ENDPOINT DASHSCOPE_TTS_MODEL DASHSCOPE_TTS_VOICE_ENROLLMENT_ENDPOINT JAMENDO_CLIENT_ID JAMENDO_BASE_URL JAMENDO_DEFAULT_LIBRARIES ARK_API_KEY ARK_BASE_URL DOUBAO_VISION_MODEL; do
              value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
              if [ -z "$value" ]; then
                echo "$key is required for production deploy"
                exit 1
              fi
            done

            if [ -n "$(grep -E '^WECHAT_JSSDK_ALLOWED_ORIGINS=' .env | cut -d= -f2-)" ]; then
              for key in WECHAT_H5_APP_ID WECHAT_H5_APP_SECRET; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when WECHAT_JSSDK_ALLOWED_ORIGINS is configured"
                  exit 1
                fi
              done
            fi

            CHAT_LINK_SEARCH_PROVIDER_VALUE="$(grep -E '^CHAT_LINK_SEARCH_PROVIDER=' .env | cut -d= -f2-)"
            if [ "$CHAT_LINK_SEARCH_PROVIDER_VALUE" = "tavily" ]; then
              for key in TAVILY_API_KEY TAVILY_SEARCH_ENDPOINT CHAT_LINK_SEARCH_TIMEOUT_S; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when CHAT_LINK_SEARCH_PROVIDER=tavily"
                  exit 1
                fi
              done
            fi

            if [ "$APNS_ENABLED" = "true" ]; then
              for key in APNS_TEAM_ID APNS_KEY_ID APNS_AUTH_KEY_PATH APNS_TOPIC APNS_USE_SANDBOX; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when APNS_ENABLED=true"
                  exit 1
                fi
              done
              APNS_AUTH_KEY_PATH_VALUE="$(grep -E '^APNS_AUTH_KEY_PATH=' .env | cut -d= -f2-)"
              if [ "$APNS_AUTH_KEY_PATH_VALUE" != "/app/companion-secrets/apns/AuthKey_SG87KSNWZH.p8" ]; then
                echo "APNS_AUTH_KEY must be /app/companion-secrets/apns/AuthKey_SG87KSNWZH.p8"
                exit 1
              fi
              if ! sudo test -r "$APNS_AUTH_KEY_PATH_VALUE"; then
                echo "APNS_AUTH_KEY must be a readable .p8 file path on the VPS when APNS_ENABLED=true"
                exit 1
              fi
              if ! sudo grep -q "BEGIN PRIVATE KEY" "$APNS_AUTH_KEY_PATH_VALUE"; then
                echo "APNS_AUTH_KEY path does not point to a valid .p8 private key file"
                exit 1
              fi
            fi

            APPLE_IAP_ENABLED_VALUE="$(grep -E '^APPLE_IAP_ENABLED=' .env | cut -d= -f2-)"
            if [ "$APPLE_IAP_ENABLED_VALUE" = "true" ]; then
              for key in APPLE_IAP_BUNDLE_ID APPLE_IAP_ISSUER_ID APPLE_IAP_KEY_ID APPLE_IAP_APP_APPLE_ID; do
                value="$(grep -E "^${key}=" .env | cut -d= -f2-)"
                if [ -z "$value" ]; then
                  echo "$key is required when APPLE_IAP_ENABLED=true"
                  exit 1
                fi
              done
              APPLE_IAP_KEY_PATH_VALUE="$(grep -E '^APPLE_IAP_PRIVATE_KEY_PATH=' .env | cut -d= -f2-)"
              if [ -z "$APPLE_IAP_KEY_PATH_VALUE" ]; then
                echo "APPLE_IAP_PRIVATE_KEY_PATH is required when APPLE_IAP_ENABLED=true"
                exit 1
              fi
              if ! sudo test -r "$APPLE_IAP_KEY_PATH_VALUE"; then
                echo "APPLE_IAP_PRIVATE_KEY_PATH must be a readable .p8 file on the VPS when APPLE_IAP_ENABLED=true"
                exit 1
              fi
              if ! sudo grep -q "BEGIN PRIVATE KEY" "$APPLE_IAP_KEY_PATH_VALUE"; then
                echo "APPLE_IAP_PRIVATE_KEY_PATH does not point to a valid .p8 private key file"
                exit 1
              fi
            fi

            source scripts/deploy_apns_preflight.sh

            echo "==> Starting data services"
            $DOCKER compose -f docker-compose.deploy.yml up -d postgres redis ollama

            # embedding 模型由代码决定, 不再走 CI 变量: 它跟十个写死在代码里的
            # 相似度阈值是一整套, 能被单独改动正是要防的事故形态 (改了模型没重标
            # 阈值 → 检索静默失准, 日志上看不出来). 单一真相源在
            # app/services/memory/config.py:CALIBRATED_EMBEDDING_MODEL.
            EMBEDDING_MODEL_VALUE="$(sed -n 's/^CALIBRATED_EMBEDDING_MODEL = "\(.*\)"$/\1/p' app/services/memory/config.py)"
            if [ -z "$EMBEDDING_MODEL_VALUE" ]; then
              echo "Could not read CALIBRATED_EMBEDDING_MODEL from app/services/memory/config.py"
              exit 1
            fi
            echo "==> Embedding model (from code): ${EMBEDDING_MODEL_VALUE}"
            if ! $DOCKER compose -f docker-compose.deploy.yml exec -T ollama ollama list | awk 'NR > 1 {print $1}' | grep -Eq "^${EMBEDDING_MODEL_VALUE}(:|$)"; then
              echo "==> Pulling embedding model: ${EMBEDDING_MODEL_VALUE}"
              $DOCKER compose -f docker-compose.deploy.yml exec -T ollama ollama pull "$EMBEDDING_MODEL_VALUE"
            fi

            echo "==> Stopping server before migrations"
            $DOCKER compose -f docker-compose.deploy.yml stop server || true

            echo "==> Running database migrations"
            MIGRATION_DATABASE_URL_VALUE="$(grep -E '^MIGRATION_DATABASE_URL=' .env | cut -d= -f2-)"
            if [ -z "$MIGRATION_DATABASE_URL_VALUE" ]; then
              echo "MIGRATION_DATABASE_URL secret is required for Prisma migrations"
              exit 1
            fi
            # If a migration failed (P3018) and was fixed in git, mark it rolled back
            # so migrate deploy can re-apply the corrected SQL. No-op when not needed.
            $DOCKER compose -f docker-compose.deploy.yml run --rm --no-deps \
              -e DATABASE_URL="$MIGRATION_DATABASE_URL_VALUE" \
              -e DIRECT_DATABASE_URL="$MIGRATION_DATABASE_URL_VALUE" \
              server prisma migrate resolve --rolled-back 20260917120000_vip_activation_codes \
              || true
            $DOCKER compose -f docker-compose.deploy.yml run --rm --no-deps \
              -e DATABASE_URL="$MIGRATION_DATABASE_URL_VALUE" \
              -e DIRECT_DATABASE_URL="$MIGRATION_DATABASE_URL_VALUE" \
              server prisma migrate deploy

            echo "==> Starting server stack"
            test "$($DOCKER image inspect --format '{{.Id}}' companion-server:deploy)" = "$CANDIDATE_IMAGE"
            $DOCKER compose -f docker-compose.deploy.yml up -d --no-deps --no-build --pull never server
            test "$($DOCKER inspect --format '{{.Image}}' companion-server)" = "$CANDIDATE_IMAGE"
            $DOCKER compose -f docker-compose.deploy.yml ps

            echo "==> Waiting for server health"
            for i in $(seq 1 40); do
              status="$($DOCKER inspect -f '{{.State.Health.Status}}' companion-server 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                curl -fsS http://127.0.0.1:8000/health
                echo
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "companion-server did not become healthy"
                $DOCKER compose -f docker-compose.deploy.yml logs --tail=200 server || true
                exit 1
              fi
              sleep 3
            done

            source scripts/deploy_host_maintenance.sh
