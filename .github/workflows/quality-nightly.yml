name: Nightly chat quality
on:
  schedule:
    # Asia/Shanghai 23:30. GitHub starts scheduled runs late: 2026-10-29..11-17
    # the 03:30 schedule began 3h08m-7h01m afterwards, i.e. in the day.
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-nightly
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Four scenarios run in parallel (~1.5h); sequential replay took 5-6h. SQL
    # per-call reservations still enforce the 5 CNY run and 120 CNY monthly limits.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install isolated replay dependencies
        run: python -m pip install -c runtime-constraints.txt -e '.[quality]'
      - name: Generate offline Prisma types (no database connection)
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/quality_no_database
        run: prisma generate
      - name: Run bounded quality evaluation
        env:
          EVAL_ARK_API_KEY: ${{ secrets.EVAL_ARK_API_KEY }}
          EVAL_DASHSCOPE_API_KEY: ${{ secrets.EVAL_DASHSCOPE_API_KEY }}
          PYTHON_DOTENV_DISABLED: '1'
        run: python -m evals.quality.nightly
      # No artifact upload: private review cases and prompt snapshots must not
      # become public attachments in this public repository.
