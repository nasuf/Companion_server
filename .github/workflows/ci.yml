name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    services:
      tts-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      proactive-test-postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: companion_proactive_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      runtime-test-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      G03_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RUNTIME_JOB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PROACTIVE_E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/companion_proactive_e2e
      PROACTIVE_E2E_REDIS_URL: redis://127.0.0.1:6379/14
      JWT_SECRET: ci-test-jwt-secret-for-backend-quality-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c runtime-constraints.txt -e ".[dev]"

      - name: Validate Prisma schema
        run: prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: prisma generate --schema prisma/schema.prisma

      - name: Compile Python sources
        run: python -m compileall -q app jobs scripts evals tests

      - name: Validate agent eval cases
        run: |
          python evals/run_local.py --validate-only
          python evals/long_companion_sim.py --validate-only

      - name: Prepare isolated proactive E2E database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/companion_proactive_e2e
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/companion_proactive_e2e
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d companion_proactive_e2e -c 'CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions;'
          prisma migrate deploy

      - name: Run backend quality tests
        run: |
          pytest \
            tests/test_execution_scope.py \
            tests/test_execution_scope_postgres.py \
            tests/test_runtime_data_reset.py \
            tests/test_prompt_publication_metadata.py \
            tests/test_configuration_consistency_e2e.py \
            tests/test_prompt_store.py \
            tests/test_prompt_sync_overwrite_warning.py \
            tests/test_proactive_common_rules.py \
            tests/test_proactive_activity_e2e.py \
            tests/test_offline_quality_e2e.py \
            tests/test_offline_regional_discovery_e2e.py \
            tests/test_offline_gallery_quality.py \
            tests/test_reply_prefix.py \
            tests/test_offline_activity_companion.py \
            tests/test_offline_activity_lifecycle.py \
            tests/test_prompt_optional_reference_rows.py \
            tests/test_voice_enrollment_flow.py \
            tests/test_voice_enrollment_postgres.py \
            tests/test_release_archive.py \
            tests/test_release_archive_workflow.py \
            tests/test_chat_graph_deploy_config.py \
            tests/test_chat_main_graph.py \
            tests/test_chat_graph_rollout.py \
            tests/test_chat_graph_rollout_postgres.py \
            tests/test_chat_graph_equivalence.py \
            tests/test_chat_graph_trace_structure.py \
            tests/test_trace_enrich.py \
            tests/test_trace_mirror.py \
            tests/test_graph_eval_safety.py \
            tests/test_graph_eval_preconditions.py \
            tests/test_reply_register_eval.py \
            tests/test_local_tracer.py \
            tests/test_tracing.py \
            tests/test_traced_usage_session.py \
            tests/test_orchestrator_phases.py \
            tests/test_short_circuit_post_process.py \
            tests/test_crisis_safety.py \
            tests/test_agent_evals.py \
            tests/test_security_config.py \
            tests/test_auth_security.py \
            tests/test_memory_privacy_api.py \
            tests/test_memory_quality.py \
            tests/test_memory_watermark.py \
            tests/test_memory_system_integration.py \
            tests/test_l2_dynamics_workspace_scope.py \
            tests/test_runtime_job_queue.py \
            tests/test_runtime_job_atomic.py \
            tests/test_runtime_job_crash_recovery.py \
            tests/test_agent_initialization_queue.py \
            tests/test_scheduler_distributed_jobs.py \
            tests/test_public_endpoints_ownership.py \
            tests/test_chat_endpoint_security.py \
            tests/test_ws_auth.py \
            tests/test_ws_pubsub.py \
            tests/test_ws_ack.py \
            tests/test_ws_route_registered.py \
            tests/test_user_turn_aggregation.py \
            tests/test_scheduler_aggregation_enqueue.py \
            tests/test_aggregation_workspace_isolation.py \
            tests/test_redis_resilience.py \
            tests/test_ownership_dependencies.py \
            tests/test_api_integration.py \
            tests/test_llm_resilience.py \
            tests/test_observability_filter.py \
            tests/test_legacy_apns_logging.py \
            tests/test_deploy_apns_preflight.py \
            tests/test_prompt_store.py \
            tests/test_prompt_phase7_hardening.py \
            tests/test_reply_prompt_format.py \
            tests/test_prompt_optional_reference_rows.py \
            tests/test_phase6_prompt_audit.py \
            tests/test_admin_prompt_replay.py \
            tests/test_admin_stats_operations.py \
            tests/test_proactive_history.py \
            tests/test_proactive_policy.py \
            tests/test_proactive_reminder_double_fire.py \
            -q

  chat-safety-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build candidate runtime image
        run: docker build -t companion-server:ci-chat-safety .

      - name: Verify prompt validation inside the packaged runtime
        run: |
          docker run --rm --network none \
            -e APP_ENV=test -e JWT_SECRET=ci-isolated-prompt-runtime-validation-secret \
            --entrypoint python companion-server:ci-chat-safety -c '
          import json
          from app.services.prompting.store import _prompt_eval_result
          result = _prompt_eval_result(prompt_key="runtime.check", change_type="manual_save")
          assert result["ok"] is True, result
          assert result["mode"] == "validate_only", result
          print(json.dumps({"ok": result["ok"], "mode": result["mode"], "validated_cases": result["agent_eval"]["validated_cases"]}))
          '

      - name: Prepare disposable Redis image
        run: |
          docker pull redis:7-alpine
          docker pull nginx:1.24-alpine

      - name: Verify chat security and reconnect over real HTTP, WebSocket and Redis
        run: |
          python3 scripts/test_chat_safety_e2e.py \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e"

      - name: Verify graph execution through authenticated WebSocket and Redis
        run: |
          python3 scripts/test_chat_safety_e2e.py --graph \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/graph"

      - name: Verify full graph rollout through authenticated WebSocket and Redis
        run: |
          python3 scripts/test_chat_safety_e2e.py --graph --graph-all \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/graph-all"

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-safety-e2e
          path: ${{ runner.temp }}/chat-safety-e2e
          retention-days: 7
