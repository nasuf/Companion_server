name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      tts-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      proactive-test-postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: companion_proactive_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      runtime-test-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      G03_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RUNTIME_JOB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      MEMORY_EVAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/companion_memory_eval_ci
      MEMORY_EVAL_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PROACTIVE_E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/companion_proactive_e2e
      PROACTIVE_E2E_REDIS_URL: redis://127.0.0.1:6379/14
      JWT_SECRET: ci-test-jwt-secret-for-backend-quality-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c runtime-constraints.txt -e ".[dev]"

      - name: Validate Prisma schema
        run: prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: prisma generate --schema prisma/schema.prisma

      - name: Compile Python sources
        run: python -m compileall -q app jobs scripts evals tests

      - name: Validate agent eval cases
        run: |
          python evals/run_local.py --validate-only
          python evals/long_companion_sim.py --validate-only
          python evals/persona_grounding/run_eval.py --validate-only --output /tmp/persona-validation.json
          python -m evals.memory_baseline.run_eval --validate-only

      - name: Prepare isolated memory evaluation database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/companion_memory_eval_ci
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/companion_memory_eval_ci
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE companion_memory_eval_ci;'
          psql -h 127.0.0.1 -p 5433 -U postgres -d companion_memory_eval_ci -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions;'
          prisma migrate deploy

      - name: Prepare isolated proactive E2E database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/companion_proactive_e2e
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/companion_proactive_e2e
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d companion_proactive_e2e -c 'CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions;'
          prisma migrate deploy

      - name: Install pinned browser for real API regression
        run: python -m playwright install --with-deps chromium

      - name: Run ALL backend tests with real disposable dependencies
        run: python scripts/run_regression_gate.py --output reports/regression

      - name: Enforce coverage, inventory, skips and evidence identity
        if: always()
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/check_regression_gate.py --output reports/regression --base "$GATE_BASE"

      - name: Publish regression summary
        if: always()
        run: |
          if test -f reports/regression/summary.md; then
            cat reports/regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Regression evidence was not produced; gate did not pass.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve full regression and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-${{ github.sha }}
          path: reports/
          retention-days: 7

  chat-safety-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build candidate runtime image
        run: docker build -t companion-server:ci-chat-safety .

      - name: Verify prompt validation inside the packaged runtime
        run: |
          docker run --rm --network none \
            -e APP_ENV=test -e JWT_SECRET=ci-isolated-prompt-runtime-validation-secret \
            --entrypoint python companion-server:ci-chat-safety -c '
          import json
          from app.services.prompting.store import _prompt_eval_result
          result = _prompt_eval_result(prompt_key="runtime.check", change_type="manual_save")
          assert result["ok"] is True, result
          assert result["mode"] == "validate_only", result
          print(json.dumps({"ok": result["ok"], "mode": result["mode"], "validated_cases": result["agent_eval"]["validated_cases"]}))
          '

      - name: Prepare disposable Redis image
        run: |
          docker pull redis:7-alpine
          docker pull nginx:1.24-alpine
          docker pull pgvector/pgvector:0.8.0-pg16

      - name: Verify two workers survive slow imports and worker replacement
        run: |
          python3 scripts/test_server_workers_e2e.py \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/workers"

      - name: Verify independent roles with owned SQL and Redis
        run: |
          python3 scripts/test_runtime_roles_e2e.py \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/roles"

      - name: Verify heartbeat and startup-failure worker diagnostics
        run: |
          python3 scripts/test_api_server_diagnostics_e2e.py \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/worker-diagnostics"

      - name: Verify chat security and reconnect over real HTTP, WebSocket and Redis
        run: |
          python3 scripts/test_chat_safety_e2e.py \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e"

      - name: Verify graph execution through authenticated WebSocket and Redis
        run: |
          python3 scripts/test_chat_safety_e2e.py --graph \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/graph"

      - name: Verify full graph rollout through authenticated WebSocket and Redis
        run: |
          python3 scripts/test_chat_safety_e2e.py --graph --graph-all \
            --image companion-server:ci-chat-safety \
            --output "$RUNNER_TEMP/chat-safety-e2e/graph-all"

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-safety-e2e
          path: ${{ runner.temp }}/chat-safety-e2e
          retention-days: 7
